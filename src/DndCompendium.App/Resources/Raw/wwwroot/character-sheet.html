/* ============================================================
   12-app.js — la aplicación: rutas (menú ↔ hoja), enlace de campos,
   refresco de pantalla y acciones de los botones (data-act)
   ============================================================ */
const App = (() => {
  let ch = null;        // personaje abierto (null en el menú)
  let tab = 'front';    // página visible: front | details | spells

  // ---------- Rutas con #hash para que el botón "atrás" funcione ----------
  function go(hash) {
    if ((location.hash || '') === hash || (!location.hash && hash === '')) route();
    else location.hash = hash;
  }
  function route() {
    Modal.close();
    const m = location.hash.match(/^#c\/(.+)$/);
    const c = m && Store.get(m[1]);
    if (c && (!ch || ch.id !== c.id)) tab = 'front';      // otro personaje: empieza por la hoja principal
    if (c) renderSheet(c); else renderHome();
  }

  function renderHome() {
    ch = null;
    document.body.dataset.view = 'home';
    $('#app').innerHTML = Menu.html();
    document.title = 'Hojas de personaje · D&D 5e';
  }

  function renderSheet(c) {
    ch = c;
    if (!ch.spell && tab === 'spells') tab = 'front';
    Calc.syncSlots(ch);
    const caster = ch.type === 'caster';
    document.body.dataset.view = 'sheet';
    document.body.dataset.type = ch.type;
    if (!document.body.dataset.tools) document.body.dataset.tools = window.innerWidth >= 1240 ? 'open' : 'closed';

    $('#app').innerHTML = `
      <div class="shell">
        <header class="topbar no-print">
          <button type="button" class="btn btn-ghost" data-act="home">${icon('back')}<span class="tb-hide">Personajes</span></button>
          <div class="tb-id"><b class="tb-name" data-mirror="info.name"></b><span class="tb-type">${Menu.typeLabel(ch.type)}</span></div>
          <nav class="tabs" role="tablist" aria-label="Páginas de la hoja">
            <button type="button" role="tab" data-tab="front">Hoja</button>
            <button type="button" role="tab" data-tab="details">Detalles</button>
            ${caster ? '<button type="button" role="tab" data-tab="spells">Conjuros</button>' : ''}
          </nav>
          <div class="tb-tools">
            <span id="save-state" class="save-state" aria-live="polite"></span>
            <button type="button" class="btn btn-ghost icon-only" data-act="print" title="Imprimir o guardar como PDF" aria-label="Imprimir">${icon('printer')}</button>
            <button type="button" class="btn btn-ghost icon-only" data-act="export-one" data-arg="${ch.id}" title="Exportar este personaje" aria-label="Exportar">${icon('download')}</button>
            <button type="button" class="btn btn-ghost icon-only" data-act="theme" title="Tema claro/oscuro" aria-label="Cambiar tema">${icon('contrast')}</button>
            <button type="button" class="btn" data-act="tools-toggle">${icon('d20')}<span class="tb-hide">Herramientas</span></button>
          </div>
        </header>
        <div id="hud" class="hud no-print" aria-label="Estado del personaje"></div>
        <div class="stage">
          <div class="pages">
            ${Front.html(ch)}${Details.html(ch)}${caster ? Spells.html(ch) : ''}
          </div>
          <aside id="tools" class="tools no-print" aria-label="Herramientas">${Tools.html(ch)}</aside>
        </div>
      </div>`;
    setTab(tab);
    refresh();
    Tools.renderHistory();
    measureBar();
    window.scrollTo(0, 0);
  }

  // El panel de herramientas empieza justo debajo de la barra superior (cuya altura cambia al achicar la ventana)
  function measureBar() {
    const bar = $('.topbar');
    document.documentElement.style.setProperty('--tb-h', (bar ? bar.offsetHeight : 52) + 'px');
  }

  function setTab(name) {
    if (!$(`.page[data-page="${name}"]`)) name = 'front';
    tab = name;
    $$('.page').forEach(p => p.classList.toggle('is-active', p.dataset.page === name));
    $$('[data-tab]').forEach(b => { const on = b.dataset.tab === name; b.setAttribute('aria-selected', String(on)); b.classList.toggle('on', on); });
    if (name === 'spells') Spells.filter(ch);
  }

  // ---------- Refresco: pone en pantalla lo que dice el personaje ----------
  function refresh() {
    if (!ch) return;
    if (Calc.syncSlots(ch) && ch.spell) Spells.renderSlots(ch);
    const out = Calc.outputs(ch);
    const active = document.activeElement;

    $$('[data-out]').forEach(el => { const v = out[el.dataset.out]; if (v !== undefined) el.textContent = v; });
    $$('[data-mirror]').forEach(el => { el.textContent = getPath(ch, el.dataset.mirror) || 'Sin nombre'; });

    $$('[data-bind]').forEach(el => {
      if (el === active) return;
      const v = getPath(ch, el.dataset.bind);
      const s = v == null ? '' : String(v);
      if (el.value !== s) el.value = s;
    });
    $$('[data-st]').forEach(el => { el.dataset.state = String(toInt(getPath(ch, el.dataset.st), 0)); });
    $$('.pips').forEach(p => {
      const n = toInt(getPath(ch, p.dataset.pips), 0);
      $$('.pip', p).forEach((b, i) => { b.classList.toggle('on', i < n); b.setAttribute('aria-pressed', String(i < n)); });
    });
    $$('[data-ovr]').forEach(el => {
      if (el === active) return;
      const ov = getPath(ch, el.dataset.ovr);
      const isOvr = ov != null && ov !== '';
      const base = String(out[el.dataset.calc]);
      el.value = isOvr ? (el.dataset.signed ? signed(toInt(ov, 0)) : String(ov))
                       : (el.dataset.signed ? base : base.replace(/^\+/, ''));
      const wrap = el.closest('.ovr'); if (wrap) wrap.classList.toggle('is-ovr', isOvr);
    });
    Tools.renderHud(ch);
  }

  // Cada vez que algo cambia: guardar + refrescar
  function changed() {
    if (!ch) return;
    Store.touch(ch);
    const s = $('#save-state'); if (s) { s.textContent = 'Guardando…'; s.className = 'save-state'; }
    refresh();
  }

  function setFromField(el) {
    let v = el.value;
    if (el.dataset.type === 'int') v = v === '' ? 0 : toInt(v, 0);
    setPath(ch, el.dataset.bind, v);
  }

  // Para vistas que se vuelven a dibujar por completo
  const rerender = {
    atk: () => { $('#atk-list').innerHTML = Front.attacks(ch); },
    res: () => { $('#res-list').innerHTML = Front.resources(ch); },
    list: l => { $(`[data-list="${l}"]`).innerHTML = Spells.listHTML(ch, l); Spells.filter(ch); },
  };

  const slug = s => (s || 'personaje').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'personaje';

  // ---------- Tema ----------
  function applyTheme() {
    const t = Store.settings().theme;
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    else delete document.documentElement.dataset.theme;
  }

  // ---------- Descansos ----------
  function restShort() {
    const info = () => `<p>Dados de golpe: <b>${Calc.hdLeft(ch)}</b> de ${Calc.hdTotal(ch)} (d${ch.hdDie}).<br>
      Puntos de golpe: <b>${ch.hp.current}</b> / ${ch.hp.max}.</p>`;
    Modal.open({
      title: 'Descanso corto',
      html: `<div id="rs-info">${info()}</div>
        <p class="hint">Gasta dados de golpe para curarte (dado + Constitución). Al terminar se recuperan los recursos marcados como «Desc. corto»${ch.spell && ch.spell.slotsRecharge === 'short' ? ' y tus espacios de magia de pacto' : ''}.</p>`,
      buttons: [
        { label: 'Cancelar', cls: 'btn-ghost' },
        { label: 'Gastar un dado', onClick: d => { Game.spendHD(ch); changed(); $('#rs-info', d).innerHTML = info(); return true; } },
        { label: 'Terminar descanso', cls: 'btn-primary', onClick: () => { Game.shortRest(ch); changed(); Toast.show('Descanso corto terminado.', { kind: 'good' }); } },
      ],
    });
  }
  function restLong() {
    Modal.open({
      title: 'Descanso largo',
      html: `<ul class="plain">
          <li>Recuperas todos los puntos de golpe y pierdes los temporales.</li>
          <li>Recuperas la mitad de tus dados de golpe (mínimo 1).</li>
          ${ch.spell ? '<li>Recuperas todos los espacios de conjuro y termina la concentración.</li>' : ''}
          <li>Se recuperan los recursos de «Desc. corto» y «Desc. largo».</li>
          <li>Se reinician las salvaciones de muerte y baja un nivel de agotamiento.</li></ul>`,
      buttons: [
        { label: 'Cancelar', cls: 'btn-ghost' },
        { label: 'Descansar', cls: 'btn-primary', onClick: () => { Game.longRest(ch); changed(); Toast.show('Descanso largo terminado.', { kind: 'good' }); } },
      ],
    });
  }

  // Botones Daño / Curar de la hoja: leen la cantidad del cuadro de al lado
  function hpAmount(kind) {
    const f = $('#hp-amt');
    const n = toInt(f.value, 0);
    if (n <= 0) {
      Toast.show('Escribe la cantidad en el cuadro junto a «Daño» y «Curar» y vuelve a pulsar.', { kind: 'warn' });
      f.focus();
      return;
    }
    if (kind === 'damage') Game.damage(ch, n);
    else {
      const got = Game.heal(ch, n);
      Toast.show(`Curas ${got} PG. PG: ${ch.hp.current}${ch.hp.max > 0 ? ' de ' + ch.hp.max : ''}.`, { kind: 'good' });
    }
    f.value = '';
    changed();
  }

  // ---------- Acciones de los botones: data-act="nombre" data-arg="valor" ----------
  const Actions = {
    home: () => NativeBridge.isActive() ? NativeBridge.close() : go(''),
    open: id => go('#c/' + id),
    new: () => Menu.openNew(),
    dup: id => { Store.duplicate(id); renderHome(); },
    delete: id => Menu.confirmDelete(id),
    'export-one': id => { const c = Store.get(id); if (c) download(slug(c.info.name) + '.json', Store.exportOne(id)); },
    'export-all': () => download('personajes-dnd5e.json', Store.exportAll()),
    import: () => $('#import-file').click(),
    theme: () => {
      const order = ['auto', 'dark', 'light'];
      const next = order[(order.indexOf(Store.settings().theme) + 1) % 3];
      Store.setSetting('theme', next); applyTheme();
      Toast.show('Tema: ' + { auto: 'según el sistema', dark: 'oscuro', light: 'claro' }[next]);
    },
    print: () => NativeBridge.isActive() ? NativeBridge.print() : window.print(),

    roll: arg => Game.roll(ch, arg),
    atk: i => Game.attack(ch, +i),
    dmg: (i, ev) => Game.attackDamage(ch, +i, ev.shiftKey),
    'crit-dmg': i => Game.attackDamage(ch, +i, true),
    'atk-add': () => { ch.attacks.push({ name: '', bonus: '', damage: '' }); rerender.atk(); changed(); },
    'atk-del': i => { ch.attacks.splice(+i, 1); rerender.atk(); changed(); },
    'res-add': () => { ch.resources.push({ name: '', total: 1, used: 0, recharge: 'long' }); rerender.res(); changed(); },
    'res-del': i => { ch.resources.splice(+i, 1); rerender.res(); changed(); },
    'ovr-reset': path => { setPath(ch, path, null); changed(); },

    damage: () => hpAmount('damage'),
    heal: () => hpAmount('heal'),
    'hd-spend': () => { Game.spendHD(ch); changed(); },
    'death-roll': () => { Game.deathRoll(ch); changed(); },
    potion: k => { Game.potion(ch, k); changed(); },

    cast: arg => { const [l, i] = arg.split(':').map(Number); Game.cast(ch, l, i); changed(); },
    'spell-del': arg => {
      const [l, i] = arg.split(':').map(Number);
      if (ch.spell.lists[l][i]) ch.spell.lists[l].splice(i, 1);
      rerender.list(l); changed();
    },
    'conc-end': () => { ch.spell.concentration = ''; changed(); },

    die: d => { if (d === 'd20') Dice.check('d20'); else Dice.expression(d, '1' + d); },
    'hist-clear': () => Dice.clear(),
    'tools-toggle': () => { document.body.dataset.tools = document.body.dataset.tools === 'open' ? 'closed' : 'open'; },
    'rest-short': () => restShort(),
    'rest-long': () => restLong(),
  };

  // ---------- Eventos (uno solo para toda la página) ----------
  function bindEvents() {
    document.addEventListener('click', e => {
      const t = e.target;
      const act = t.closest('[data-act]');
      if (act) { Actions[act.dataset.act]?.(act.dataset.arg, e, act); return; }
      if (!ch) return;
      const st = t.closest('[data-st]');
      if (st) {
        setPath(ch, st.dataset.st, (toInt(getPath(ch, st.dataset.st), 0) + 1) % toInt(st.dataset.max, 2));
        changed(); return;
      }
      const pip = t.closest('.pip');
      if (pip) {
        const cur = toInt(getPath(ch, pip.dataset.pip), 0), i = +pip.dataset.i;
        setPath(ch, pip.dataset.pip, cur === i + 1 ? i : i + 1);
        changed(); return;
      }
      const tb = t.closest('[data-tab]');
      if (tb) { setTab(tb.dataset.tab); window.scrollTo(0, 0); return; }
      const md = t.closest('[data-mode]');
      if (md) Dice.setMode(md.dataset.mode);
    });

    document.addEventListener('input', e => {
      const el = e.target;
      if (el.id === 'sp-filter') { if (ch) Spells.filter(ch); return; }
      if (!ch) return;
      if (el.matches('[data-ovr]')) {
        const raw = el.value.trim();
        setPath(ch, el.dataset.ovr, (raw === '' || raw === '+' || raw === '-') ? null : toInt(raw, 0));
        changed(); return;
      }
      if (!el.matches('[data-bind]')) return;
      if (el.dataset.bind === 'hp.max') {
        const wasFull = toInt(ch.hp.current, 0) === toInt(ch.hp.max, 0);   // incluye el 0/0 de un personaje nuevo
        setFromField(el);
        if (wasFull) ch.hp.current = ch.hp.max;
        changed(); return;
      }
      setFromField(el);
      const li = el.closest('.spell.is-blank');                       // al escribir en la fila vacía, aparece otra
      if (li && el.value.trim()) {
        li.classList.remove('is-blank');
        li.insertAdjacentHTML('afterend', Spells.rowHTML(ch, +li.dataset.l, +li.dataset.i + 1, null));
      }
      changed();
    });

    document.addEventListener('change', e => {
      const el = e.target;
      if (el.id === 'import-file') {
        const f = el.files[0]; if (!f) return;
        f.text().then(txt => {
          try { const n = Store.importText(txt); Toast.show(n ? `Importados ${n} personaje(s).` : 'El archivo no tiene personajes.', { kind: n ? 'good' : 'warn' }); renderHome(); }
          catch (err) { Toast.show('No se pudo leer el archivo: no es un JSON válido.', { kind: 'bad' }); }
        });
        el.value = ''; return;
      }
      if (el.id === 'sp-prep') { Spells.filter(ch); return; }
      if (el.id === 'sp-auto') {
        ch.spell.auto = el.checked;
        Spells.renderSlots(ch); changed(); return;
      }
      if (!ch) return;
      if (el.type === 'number' && (el.min !== '' || el.max !== '') && el.dataset.bind) {   // respeta min / max
        let v = toInt(el.value, 0);
        if (el.min !== '') v = Math.max(+el.min, v);
        if (el.max !== '') v = Math.min(+el.max, v);
        setPath(ch, el.dataset.bind, v);
      }
      const what = el.dataset.rerender;
      if (what === 'resources') {
        ch.resources.forEach(r => { r.used = clamp(toInt(r.used, 0), 0, toInt(r.total, 0)); });
        rerender.res();
      }
      if (what === 'slots') {
        for (let l = 1; l <= 9; l++) { const s = ch.spell.slots[l]; s.used = clamp(toInt(s.used, 0), 0, toInt(s.total, 0)); }
        Spells.renderSlots(ch);
      }
      changed();
    });

    // Al salir de un campo con valor automático, vuelve a mostrar el calculado
    document.addEventListener('focusout', () => setTimeout(refresh, 0));

    document.addEventListener('submit', e => {
      if (e.target.id !== 'expr-form') return;
      e.preventDefault();
      const v = $('#expr').value.trim(); if (!v) return;
      if (!Dice.expression(v, v)) Toast.show('No entiendo esa expresión. Prueba con algo como 2d6+3.', { kind: 'warn' });
    });
  }

  function init() {
    Store.load();
    applyTheme();
    Dice.onRoll(entry => { if (entry) RollToast.show(entry); Tools.renderHistory(); });
    Store.onSaved(ok => {
      const s = $('#save-state'); if (!s) return;
      s.textContent = ok ? 'Guardado' : 'No se pudo guardar';
      s.className = 'save-state' + (ok ? ' ok' : ' bad');
    });
    bindEvents();
    window.addEventListener('hashchange', route);
    window.addEventListener('resize', debounce(measureBar, 100));
    window.addEventListener('pagehide', () => Store.flush());
    route();
  }

  return { init, open: id => go('#c/' + id), showHome: () => go(''), current: () => ch };
})();

/* ============================================================
   Integración Drivebrew
   Conserva la hoja original y enlaza su guardado con el perfil nativo.
   En un navegador común sigue funcionando como el HTML independiente.
   ============================================================ */
const NativeBridge = (() => {
  let active = false;
  let loading = false;
  let nativeCharacterId = '';
  let lastSnapshot = '';

  const bridge = () => window.HybridWebView || window.chrome?.webview || null;

  function send(message) {
    const json = JSON.stringify(message);
    try {
      if (window.HybridWebView?.SendRawMessage) window.HybridWebView.SendRawMessage(json);
      else if (window.chrome?.webview?.postMessage) window.chrome.webview.postMessage(json);
      else if (window.webkit?.messageHandlers?.webwindowinterop)
        window.webkit.messageHandlers.webwindowinterop.postMessage(json);
    } catch (_) { /* El siguiente saludo reintentará el enlace. */ }
  }

  const text = (fields, ...names) => {
    for (const name of names) {
      const value = fields?.[name];
      if (value !== undefined && value !== null && String(value).trim()) return String(value);
    }
    return '';
  };
  const number = (value, fallback = 0) => {
    const parsed = Number.parseInt(String(value ?? ''), 10);
    return Number.isFinite(parsed) ? parsed : fallback;
  };
  const ability = (payload, key) => {
    const upper = key.toUpperCase();
    return clamp(number(payload.abilityBaseScores?.[upper] ?? payload.textFields?.[upper], 10), 1, 30);
  };

  function legacyCharacter(payload) {
    const fields = payload.textFields || {};
    const spellRows = [...(payload.knownSpells || []), ...(payload.preparedSpells || [])];
    const classLevel = text(fields, 'ClassLevel') || (payload.classLevels || []).map(item => item?.name || '').join(' / ');
    const casterClass = /\b(?:artificer|bard|cleric|druid|paladin|ranger|sorcerer|warlock|wizard|mago|clérigo|druida|bardo|brujo|hechicero|paladín|explorador)\b/i.test(classLevel);
    const caster = spellRows.length > 0 || casterClass || !!text(fields, 'Spellcasting Class 2', 'SpellcastingAbility 2');
    const ch = Store.make(caster ? 'caster' : 'martial');
    ch.id = payload.characterId || ch.id;
    ch.info.name = payload.characterName || text(fields, 'CharacterName', 'CharacterName 2');
    const levelMatch = classLevel.match(/\b(?:[1-9]|1\d|20)\b/);
    ch.info.level = levelMatch ? number(levelMatch[0], 1) : 1;
    ch.info.class = classLevel.replace(/\b(?:[1-9]|1\d|20)\b/g, '').replace(/[\s,/-]+$/, '').trim();
    ch.info.background = text(fields, 'Background');
    ch.info.player = text(fields, 'PlayerName');
    ch.info.race = text(fields, 'Race ');
    ch.info.alignment = text(fields, 'Alignment');
    ch.info.xp = text(fields, 'XP');
    for (const key of ['str', 'dex', 'con', 'int', 'wis', 'cha']) ch.abilities[key] = ability(payload, key);
    ch.inspiration = number(text(fields, 'Inspiration'), 0);
    ch.ac = number(text(fields, 'AC', 'Armor Class'), 10);
    ch.speed = text(fields, 'Speed') || ch.speed;
    ch.hp.max = number(text(fields, 'HPMax'), 0);
    ch.hp.current = number(text(fields, 'HPCurrent'), ch.hp.max);
    ch.hp.temp = number(text(fields, 'HPTemp'), 0);
    ch.attackNotes = text(fields, 'AttacksSpellcasting');
    ch.features = text(fields, 'Features and Traits', 'Feat+Traits', 'Digital.ClassFeatures');
    ch.equipment = text(fields, 'Equipment');
    ch.details.age = text(fields, 'Age');
    ch.details.height = text(fields, 'Height');
    ch.details.weight = text(fields, 'Weight');
    ch.details.eyes = text(fields, 'Eyes');
    ch.details.skin = text(fields, 'Skin');
    ch.details.hair = text(fields, 'Hair');
    ch.details.personality = text(fields, 'PersonalityTraits ');
    ch.details.ideals = text(fields, 'Ideals');
    ch.details.bonds = text(fields, 'Bonds');
    ch.details.flaws = text(fields, 'Flaws');
    ch.details.allies = text(fields, 'Allies');
    ch.details.backstory = text(fields, 'Backstory');

    const attacks = (payload.attacks || []).filter(item => item?.name);
    if (attacks.length) ch.attacks = attacks.map(item => ({
      name: item.name || '', bonus: item.attackBonus || '', damage: item.damage || ''
    }));

    if (ch.spell) {
      ch.spell.class = text(fields, 'Spellcasting Class 2') || ch.info.class;
      const seen = new Set();
      for (const spell of spellRows) {
        const name = String(spell?.name || '').trim();
        const level = clamp(number(spell?.level, 0), 0, 9);
        const key = `${level}:${name.toLocaleLowerCase()}`;
        if (!name || seen.has(key)) continue;
        seen.add(key);
        const prepared = (payload.preparedSpells || []).some(item => item?.id === spell.id);
        ch.spell.lists[level].push({ name, prep: prepared ? 1 : 0, conc: 0 });
      }
    }
    return ch;
  }

  function parseSavedSheet(value) {
    if (!value || typeof value !== 'string') return null;
    try {
      const parsed = JSON.parse(value);
      const ch = Array.isArray(parsed?.chars) ? parsed.chars[0] : parsed;
      return ch && ch.info ? ch : null;
    } catch (_) { return null; }
  }

  function load(payload) {
    if (!payload || typeof payload !== 'object') return;
    active = true;
    nativeCharacterId = String(payload.characterId || '');
    const saved = parseSavedSheet(payload.htmlSheetJson);
    const raw = saved || legacyCharacter(payload);
    raw.id = nativeCharacterId || raw.id;
    if (!raw.info.name) raw.info.name = payload.characterName || '';
    loading = true;
    const ch = Store.replaceSingle(raw, raw.type);
    lastSnapshot = Store.exportOne(ch.id);
    loading = false;
    App.open(ch.id);
    send({ type: 'loaded' });
  }

  function snapshot(force = false) {
    if (!active || loading) return;
    const ch = App.current() || Store.all()[0];
    if (!ch) return;
    const sheetJson = Store.exportOne(ch.id);
    if (!force && sheetJson === lastSnapshot) return;
    lastSnapshot = sheetJson;
    send({ type: 'htmlSheetSave', sheetJson, characterName: ch.info?.name || '' });
  }

  function receive(raw) {
    try {
      const message = typeof raw === 'string' ? JSON.parse(raw) : raw;
      if (message?.type === 'load') load(message.payload || {});
    } catch (error) {
      send({ type: 'error', message: `No se pudo cargar la hoja: ${error.message}` });
    }
  }

  function init() {
    Store.onSaved(ok => { if (ok) snapshot(); });
    window.addEventListener('HybridWebViewMessageReceived', event => receive(event.detail?.message));
    window.chrome?.webview?.addEventListener?.('message', event => receive(event.data));
    window.addEventListener('pagehide', () => snapshot(true));
    send({ type: 'ready' });
    setTimeout(() => { if (!active) send({ type: 'ready' }); }, 300);
    setTimeout(() => { if (!active) send({ type: 'ready' }); }, 900);
  }

  return {
    init,
    isActive: () => active,
    close: () => { snapshot(true); send({ type: 'closeSheet' }); },
    print: () => { snapshot(true); setTimeout(() => window.print(), 60); },
  };
})();

document.addEventListener('DOMContentLoaded', () => { App.init(); NativeBridge.init(); });

</script>
