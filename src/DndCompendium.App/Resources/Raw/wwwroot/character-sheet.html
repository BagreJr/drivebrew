<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hojas de personaje · D&amp;D 5e</title>
<!-- La hoja es completamente offline dentro de Drivebrew. -->
<script src="_framework/hybridwebview.js"></script>
<style>
/* ============================================================
   00-base.css — colores, tipografía, botones y campos
   Para cambiar el aspecto de toda la hoja, empieza por las variables de :root
   ============================================================ */
:root {
  --font: "Alegreya Sans", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --font-caps: "Alegreya Sans SC", "Alegreya Sans", "Segoe UI", system-ui, sans-serif;

  /* Claro: piedra fría, papel casi blanco */
  --bg: #c8cdd3;
  --paper: #f6f7f8;
  --grey: #dde0e5;
  --ink: #1b1f27;
  --ink-2: #4a5160;
  --line: #2a303b;       /* trazo de los marcos */
  --rule: #b4bac4;       /* renglones y subrayados */
  --accent-caster: #4b3fb8;   /* índigo: hoja con magia */
  --accent-martial: #1b7660;  /* verdín: hoja sin magia */
  --accent-ink: #ffffff;
  --good: #1d7a4a; --bad: #b3261e; --warn: #8f6200;
  --shadow: 0 1px 2px rgba(20, 24, 32, .14), 0 10px 30px rgba(20, 24, 32, .12);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #11141a; --paper: #1c2029; --grey: #272c37; --ink: #e8eaef; --ink-2: #a4acbc;
  --line: #8d96a8; --rule: #434a59;
  --accent-caster: #a79dff; --accent-martial: #52cfae; --accent-ink: #0f1218;
  --good: #58d08b; --bad: #ff7a70; --warn: #e5b04a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 30px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141a; --paper: #1c2029; --grey: #272c37; --ink: #e8eaef; --ink-2: #a4acbc;
    --line: #8d96a8; --rule: #434a59;
    --accent-caster: #a79dff; --accent-martial: #52cfae; --accent-ink: #0f1218;
    --good: #58d08b; --bad: #ff7a70; --warn: #e5b04a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 30px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}

body { --accent: var(--accent-caster); }
body[data-type="martial"] { --accent: var(--accent-martial); }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.3 var(--font);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }

/* Iconos del sprite */
.ic { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Campos ---------- */
input, textarea, select, button { font: inherit; color: inherit; }
input, textarea, select {
  width: 100%; min-width: 0; background: transparent; border: 0; border-radius: 3px; padding: 0;
}
input:focus-visible, textarea:focus-visible, select:focus-visible { outline-offset: 1px; background: color-mix(in srgb, var(--accent) 8%, transparent); }
input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--ink-2) 55%, transparent); }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
textarea { resize: none; display: block; }
select { appearance: none; cursor: pointer; }
input[readonly] { cursor: default; }

/* Etiquetas pequeñas en versalitas, como en la hoja impresa */
.cap { font-family: var(--font-caps); font-size: .78rem; letter-spacing: .05em; color: var(--ink-2); font-weight: 600; line-height: 1.1; }

/* ---------- Botones ---------- */
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { opacity: .45; cursor: not-allowed; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  padding: .5rem .95rem; border: 1.5px solid var(--line); border-radius: 7px;
  background: var(--paper); color: var(--ink); font-weight: 700; line-height: 1.1;
  transition: background .12s, transform .08s;
}
.btn:hover:not(:disabled) { background: var(--grey); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 86%, #000); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn-sm { padding: .3rem .65rem; font-size: .9rem; }
.icon-only { padding: .5rem; }

.mini {
  display: inline-grid; place-items: center; width: 24px; height: 24px; flex: none;
  border-radius: 5px; color: var(--ink-2); font-weight: 800; font-size: .78rem;
}
.mini:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.mini.rm:hover { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.mini .ic { width: 15px; height: 15px; }

.btn-add {
  display: inline-flex; align-items: center; gap: .3rem; margin-top: .35rem; padding: .15rem .4rem;
  font-size: .86rem; font-weight: 700; color: var(--accent); border-radius: 5px;
}
.btn-add:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.btn-mini {
  padding: .1rem .5rem; border: 1.5px solid var(--line); border-radius: 5px; font-size: .78rem; font-weight: 700;
  background: var(--paper);
}
.btn-mini:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.print-only { display: none; }
.empty { font-size: .85rem; color: var(--ink-2); padding: .2rem .1rem; }
.hint { font-size: .88rem; color: var(--ink-2); }

/* ============================================================
   01-sheet.css — la hoja principal (página 1)
   Los marcos con esquinas cortadas se dibujan con dos capas: el elemento pinta el
   trazo (--line) y ::before pinta el relleno (--fill), un poco más chico.
   ============================================================ */
.frame, .octa, .ribbon, .shield, .ab-box, .prof-bar {
  --cut: 11px; --bw: 2px; --fill: var(--paper);
  --ci: calc(var(--cut) - var(--bw) * .586);
  --shape: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)),
                   calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut));
  --shape-in: polygon(var(--ci) 0, calc(100% - var(--ci)) 0, 100% var(--ci), 100% calc(100% - var(--ci)),
                      calc(100% - var(--ci)) 100%, var(--ci) 100%, 0 calc(100% - var(--ci)), 0 var(--ci));
  position: relative; isolation: isolate; background: var(--line); clip-path: var(--shape);
}
.frame::before, .octa::before, .ribbon::before, .shield::before, .ab-box::before, .prof-bar::before {
  content: ""; position: absolute; inset: var(--bw); z-index: -1; background: var(--fill); clip-path: var(--shape-in);
}
.octa { --shape: polygon(16% 0, 84% 0, 100% 50%, 84% 100%, 16% 100%, 0 50%); --shape-in: var(--shape);
        display: grid; place-items: center; width: 3.7rem; height: 2.7rem; font-size: 1.4rem; font-weight: 800; }
.shield { --shape: polygon(0 0, 100% 0, 100% 56%, 50% 100%, 0 56%); --shape-in: var(--shape); }
.ribbon { --fill: var(--grey); --shape: polygon(0 0, 100% 0, 100% 100%, 0 100%, 16px 50%); --shape-in: var(--shape); }
.ab-box { --cut: 14px; }
.prof-bar { --cut: 12px; }

.panel-grey { background: var(--grey); border-radius: 10px; padding: 8px; }
.panel-grey .frame, .panel-grey .octa, .panel-grey .shield, .panel-grey .prof-bar, .panel-grey .ab-box { --fill: var(--paper); }

/* ---------- Páginas ---------- */
.stage { display: block; }
.pages { max-width: 900px; margin: 0 auto; padding: 14px 12px 60px; }
.page { display: none; background: var(--paper); box-shadow: var(--shadow); border-radius: 4px; padding: 16px; margin-bottom: 24px; }
.page.is-active { display: block; }

.p-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.55fr); gap: 12px; margin-bottom: 12px; }
.ribbon { display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 14px 8px 28px; min-height: 80px; gap: 2px; }
.name-input, .class-input { font-size: 1.7rem; font-weight: 800; line-height: 1.1; border-bottom: 1px solid var(--rule); border-radius: 0; padding: 0 2px; }
.class-input { font-size: 1.35rem; }
.name-mirror { font-size: 1.7rem; font-weight: 800; line-height: 1.15; border-bottom: 1px solid var(--rule); padding: 0 2px; min-height: 1.3em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

.head-box { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 6px 16px; padding: 10px 18px; align-content: center; }
.hf { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.hf > input, .hf-in input { border-bottom: 1px solid var(--rule); border-radius: 0; font-weight: 600; font-size: 1.02rem; padding: 0 2px; }
.hf-in { display: flex; gap: 6px; }
.hf-in .lvl-in { width: 2.8rem; flex: none; text-align: center; }

.p-body { display: grid; grid-template-columns: 1.12fr 1fr 1fr; gap: 10px; align-items: stretch; }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col-left { gap: 4px; }

/* ---------- Columna izquierda ---------- */
.prof-bar { display: flex; align-items: center; gap: 8px; padding: 5px 12px; margin-bottom: 4px; }
.prof-bar .octa { width: 3.4rem; height: 2.4rem; font-size: 1.3rem; }
.prof-bar .octa input { text-align: center; font-weight: 800; font-size: 1.3rem; width: 100%; }
.prof-label { flex: 1; text-align: center; font-family: var(--font-caps); font-weight: 700; letter-spacing: .04em; font-size: .86rem; line-height: 1.05; }
.insp { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); }
.insp .ic { width: 20px; height: 20px; }
.insp[data-state="1"] { color: var(--accent); }
.insp[data-state="1"] .ic { fill: currentColor; }
.insp:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }

/* Botón para volver al valor automático (aparece solo si se escribió un valor a mano) */
.ovr { position: relative; }
.ovr-reset { position: absolute; right: -2px; top: -4px; width: 17px; height: 17px; display: none; place-items: center;
             border-radius: 50%; background: var(--accent); color: var(--accent-ink); z-index: 5; }
.ovr-reset .ic { width: 11px; height: 11px; }
.ovr.is-ovr .ovr-reset { display: grid; }

.ability { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; align-items: start; padding: 4px 0 5px; }
.ab-box { width: 92px; min-height: 90px; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; padding: 6px 4px 6px; }
.ab-score { width: 48px; height: 24px; text-align: center; font-weight: 800; font-size: .98rem; border: 1.5px solid var(--line); border-radius: 12px; background: var(--grey); }
.ab-mod { font-size: 2.2rem; font-weight: 800; line-height: 1; align-self: center; padding: 0 6px; border-radius: 8px; }
.ab-mod:hover { color: var(--accent); }
.ab-name { font-family: var(--font-caps); font-size: .72rem; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }

.rrows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.rrow { display: flex; align-items: center; gap: 7px; }
.rroll { display: flex; align-items: baseline; gap: 6px; flex: 1; min-width: 0; text-align: left; padding: 1px 5px; border-radius: 4px; }
.rroll:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.rroll b { min-width: 2.2ch; text-align: center; border-bottom: 1px solid var(--line); font-size: .98rem; }
.rroll span { font-family: var(--font-caps); font-size: .86rem; font-weight: 600; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.mk, .mk-o { flex: none; width: 13px; height: 13px; border: 1.6px solid var(--line); background: transparent; position: relative; }
.mk::after, .mk-o::after, .pip::after { content: ""; position: absolute; inset: -6px; }   /* zona de toque más grande */
.mk-save { transform: rotate(45deg) scale(.8); border-radius: 1px; }
.mk-skill, .mk-o { border-radius: 50%; }
.mk[data-state="1"], .mk-o[data-state="1"] { background: var(--ink); }
.mk-skill[data-state="2"] { background: var(--ink); outline: 1.5px solid var(--ink); outline-offset: 1.5px; }
.mk-skill[data-state="3"] { background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); }

.passives { display: flex; flex-direction: column; gap: 1px; margin-top: 2px; padding: 5px 6px 2px; border-top: 1.5px solid var(--line); font-size: .88rem; }
.passives span { display: flex; justify-content: space-between; }

/* Recursos propios (Furia, Ki, Inspiración…) */
.resources { margin-top: 4px; }
.res-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-areas: "name name rm" "total state rech";
           gap: 3px 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--rule); }
.res-name { grid-area: name; border-bottom: 1px solid var(--line); border-radius: 0; font-weight: 700; }
.res-row > .rm { grid-area: rm; }
.res-total { grid-area: total; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.res-total input { width: 38px; height: 28px; text-align: center; font-weight: 800; border: 1.6px solid var(--line); border-radius: 6px; background: var(--paper); }
.res-total .cap { font-size: .66rem; }
.res-state { grid-area: state; min-width: 0; }
.res-used { width: 3.4rem; text-align: center; border: 1.5px solid var(--line); border-radius: 5px; background: var(--paper); }
.res-rech { grid-area: rech; width: auto; font-size: .78rem; padding: 2px 4px; border: 1px solid var(--rule); border-radius: 5px; background: var(--paper); font-family: var(--font-caps); font-weight: 600; }

.pips { display: inline-flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.pip { position: relative; width: 16px; height: 16px; border: 1.6px solid var(--line); border-radius: 50%; background: var(--paper); transition: background .1s; }
.pip.on { background: var(--ink); }
.pip:hover { border-color: var(--accent); }
.slot-pips .pip { width: 19px; height: 19px; }
.slot-pips .pip.on { background: color-mix(in srgb, var(--ink) 20%, var(--paper)); border-style: dashed; }   /* espacio gastado */
.death-ok .pip.on { background: var(--good); border-color: var(--good); }
.death-ko .pip.on { background: var(--bad); border-color: var(--bad); }

/* ---------- Columna central ---------- */
.hp-wrap { display: flex; flex-direction: column; gap: 6px; }
.hp-frame { --cut: 14px; padding: 6px 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 160px; }
.hp-max { display: flex; align-items: baseline; gap: 6px; width: 100%; font-size: .78rem; color: var(--ink-2); font-family: var(--font-caps); font-weight: 600; letter-spacing: .04em; }
.hp-max input { width: 4ch; flex: 1; font-weight: 800; font-size: 1.05rem; color: var(--ink); border-bottom: 1px solid var(--rule); border-radius: 0; font-family: var(--font); }
.hp-big { font-size: 3.1rem; font-weight: 800; text-align: center; line-height: 1; width: 100%; padding: 2px 0; }
.hp-bar { width: 100%; height: 7px; border-radius: 4px; background: var(--rule); overflow: hidden; }
.hp-bar i { display: block; height: 100%; width: 0; background: var(--good); transition: width .25s, background .25s; }
.hp-bar[data-level="mid"] i { background: var(--warn); }
.hp-bar[data-level="low"] i { background: var(--bad); }
.hp-tools { display: flex; gap: 4px; width: 100%; }
.hp-tools input { width: 3.3rem; border: 1.5px solid var(--line); border-radius: 5px; text-align: center; font-weight: 700; background: var(--paper); }
.hp-tools .btn-dmg, .hp-tools .btn-heal { flex: 1; border-radius: 5px; font-weight: 800; font-size: .86rem; padding: 2px 4px; border: 1.5px solid var(--line); background: var(--paper); }
.btn-dmg:hover { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn-heal:hover { background: var(--good); color: #fff; border-color: var(--good); }

.temp-frame { --cut: 14px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 12px 8px; min-height: 84px; }
.temp-frame input { font-size: 2rem; font-weight: 800; text-align: center; width: 100%; }
.hp-frame .cap, .temp-frame .cap, .hd-frame .cap, .death-frame .cap { margin-top: auto; text-align: center; }

.hd-death { display: grid; grid-template-columns: 1fr 1.15fr; gap: 6px; }
.hd-frame, .death-frame { padding: 6px 8px 8px; min-height: 106px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.hd-total { font-size: .8rem; color: var(--ink-2); align-self: flex-start; }
.hd-total b { color: var(--ink); }
.hd-left { font-size: 2.1rem; font-weight: 800; line-height: 1; }
.death-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; font-size: .78rem; font-family: var(--font-caps); font-weight: 600; letter-spacing: .03em; }
.death-row .pip { width: 17px; height: 17px; }

.spell-band, .spell-band-head { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px 6px 6px; }
.octa-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }
.octa-cell .cap { font-size: .68rem; line-height: 1.05; }
.octa select { width: 100%; text-align: center; text-align-last: center; font-weight: 800; font-size: 1.15rem; }
.octa-btn { cursor: pointer; }
.octa-btn:hover { --fill: color-mix(in srgb, var(--accent) 16%, var(--paper)); }
.panel-grey .octa-btn:hover { --fill: color-mix(in srgb, var(--accent) 16%, var(--paper)); }

.attacks { flex: 1; min-height: 300px; display: flex; flex-direction: column; padding: 8px 12px 8px; gap: 3px; --cut: 14px; }
.attacks .cap:last-child { margin-top: auto; text-align: center; padding-top: 6px; }
.atk-head { display: flex; justify-content: space-between; font-family: var(--font-caps); font-size: .68rem; color: var(--ink-2); font-weight: 600; letter-spacing: .04em; }
.atk-row { position: relative; display: grid; grid-template-columns: 5.4rem minmax(0, 1fr); gap: 2px 6px; padding: 4px 0 5px; border-bottom: 1px solid var(--rule); }
.atk-name { grid-column: 1 / -1; font-weight: 700; padding-right: 26px; }
.atk-row > .rm { position: absolute; right: 0; top: 3px; }
.atk-b, .atk-d { display: flex; align-items: center; gap: 2px; background: var(--grey); border-radius: 5px; padding: 1px 2px 1px 6px; min-width: 0; }
.atk-b input { text-align: center; }
.atk-notes { flex: 1; margin-top: 6px; min-height: 110px; }
.attacks-caster .atk-row:nth-child(n) { }

/* ---------- Columna derecha ---------- */
.top3 { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 6px; align-items: end; }
.shield { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 8px 4px 0; min-height: 100px; text-align: center; --fill: var(--paper); }
.shield input { font-size: 2rem; font-weight: 800; text-align: center; width: 100%; padding: 0; }
.shield .cap { font-size: .66rem; line-height: 1; text-align: center; max-width: 5.2em; margin-top: -2px; }
.init, .speed { --cut: 11px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8px 6px 6px; min-height: 100px; }
.init input, .speed input { font-size: 1.7rem; font-weight: 800; text-align: center; width: 100%; padding: 0; }
.speed input { font-size: 1.35rem; }
.roll-corner { position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-2); }
.roll-corner:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.init .ovr-reset { right: 3px; top: auto; bottom: 22px; }
.features { flex: 1; min-height: 420px; display: flex; flex-direction: column; padding: 10px 12px 8px; --cut: 14px; }
.features textarea { flex: 1; width: 100%; }
.features .cap, .equip-foot .cap, .profs > .cap, .dbox > .cap { text-align: center; }

/* ---------- Pie: competencias y equipo ---------- */
.p-foot { display: grid; grid-template-columns: 1.12fr 2fr; gap: 10px; margin-top: 10px; }
.profs { --cut: 14px; padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 5px; }
.pf-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 3px 12px; font-size: .92rem; }
.pf-line b { flex-basis: 100%; text-align: center; font-family: var(--font-caps); letter-spacing: .05em; font-size: .86rem; }
.chk { display: inline-flex; align-items: center; gap: 5px; }
.pf-field { background: var(--grey); border-radius: 5px; padding: 3px 8px; }
.pf-title { text-align: center; font-family: var(--font-caps); font-weight: 700; letter-spacing: .05em; font-size: .86rem; margin-top: 3px; }
.pf-area { min-height: 3.1em; }

.equip { --cut: 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "coins cols potions" "foot foot foot";
         gap: 6px 12px; padding: 12px 14px 8px; min-height: 330px; }
.coins { grid-area: coins; display: flex; flex-direction: column; gap: 6px; }
.coin { display: flex; align-items: center; gap: 5px; }
.coin-l { width: 1.6rem; font-family: var(--font-caps); font-size: .8rem; font-weight: 700; color: var(--ink-2); text-align: right; }
.coin input { width: 3.7rem; height: 2rem; text-align: center; font-weight: 800; border: 1.8px solid var(--line); border-radius: 9px; background: var(--grey); }
.equip-cols { grid-area: cols; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-height: 0; }
.equip-cols textarea { height: 100%; }
.potions { grid-area: potions; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; }
.potion { display: grid; justify-items: center; gap: 2px; }
.potion .ic, .potion-btn .ic { width: 34px; height: 34px; stroke-width: 1.6; }
.potion-btn { border-radius: 8px; padding: 2px; color: var(--ink); }
.potion-btn:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.potion-n { width: 2.7rem; height: 1.6rem; text-align: center; font-weight: 800; border: 1.5px solid var(--line); border-radius: 12px; background: var(--grey); }
.potion-d { font-size: .74rem; color: var(--ink-2); font-weight: 600; }
.equip-foot { grid-area: foot; position: relative; display: flex; justify-content: center; align-items: center; min-height: 1.3em; }
.carry { position: absolute; left: 0; font-size: .8rem; color: var(--ink-2); }
.carry b { color: var(--ink); }

/* Renglones (hoja sin magia): líneas de cuaderno detrás del texto */
.lined { --lh: 1.75rem; line-height: var(--lh); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), var(--rule) calc(var(--lh) - 1px), var(--rule) var(--lh));
         background-attachment: local; background-color: transparent; }
textarea { line-height: 1.45; width: 100%; height: 100%; }
textarea.lined { line-height: var(--lh); }

textarea:hover:not(:focus) { background-color: color-mix(in srgb, var(--accent) 5%, transparent); }
.init-row { display: flex; align-items: center; gap: 1px; width: 100%; }
.init-row input { min-width: 0; }
.init .mini { flex: none; }

/* ============================================================
   02-pages.css — página 2 (detalles) y página 3 (conjuros)
   ============================================================ */

/* ---------- Detalles ---------- */
.d-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;
          grid-template-areas: "allies traits side" "story stowed stowed"; }
.d-allies { grid-area: allies; }
.d-traits { grid-area: traits; display: flex; flex-direction: column; gap: 6px; }
.d-side   { grid-area: side; display: flex; flex-direction: column; gap: 10px; }
.d-story  { grid-area: story; }
.d-stowed { grid-area: stowed; }

.dbox { display: flex; flex-direction: column; padding: 10px 12px 8px; --cut: 13px; min-height: 120px; }
.dbox textarea { flex: 1; width: 100%; }
.dbox > .cap { padding-top: 4px; }
.d-allies { min-height: 380px; }
.d-traits .dbox { flex: 1; }
.d-bg { min-height: 110px; }
.d-prof { flex: 1; }
.d-story, .d-stowed { min-height: 440px; }
.panel-grey.d-traits { padding: 8px; }

/* ---------- Conjuros ---------- */
.sp-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin-bottom: 12px; padding: 8px 12px;
              background: var(--grey); border-radius: 9px; font-size: .92rem; }
.tg { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
.tg input { width: auto; accent-color: var(--accent); }
.sp-conc { display: flex; align-items: center; gap: 6px; font-family: var(--font-caps); font-weight: 700; letter-spacing: .04em; }
.sp-conc input { width: 11rem; border-bottom: 1px solid var(--line); border-radius: 0; font-family: var(--font); font-weight: 600; }
.sp-filter input { width: 11rem; border: 1.5px solid var(--line); border-radius: 7px; padding: 3px 9px; background: var(--paper); }

.sp-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: start; }
.sp-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.lvl { border: 1.5px solid var(--rule); border-radius: 12px; padding: 7px 9px 8px; }
.lvl-head { display: flex; align-items: center; gap: 10px; min-height: 40px; margin-bottom: 4px; }
.lvl-n { flex: none; width: 38px; height: 34px; display: grid; place-items: center; background: var(--line); color: var(--paper);
         font-size: 1.3rem; font-weight: 800; clip-path: polygon(26% 0, 100% 0, 100% 100%, 26% 100%, 0 50%); padding-left: 6px; }
.lvl-title { flex: 1; font-family: var(--font-caps); font-weight: 700; letter-spacing: .08em; font-size: 1.1rem; }
.lvl-slots { display: flex; align-items: center; gap: 12px; flex: 1; flex-wrap: wrap; }
.sl-total { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.sl-total input { width: 2.6rem; height: 1.7rem; text-align: center; font-weight: 800; border: 1.6px solid var(--line); border-radius: 6px; background: var(--paper); }
.sl-total input[readonly] { background: var(--grey); border-style: dashed; }
.sl-total .cap, .sl-used .cap { font-size: .66rem; }
.sl-used { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.sl-none { font-size: .8rem; color: var(--ink-2); }

.spell-list { list-style: none; margin: 0; padding: 0; }
.spell { display: flex; align-items: center; gap: 7px; min-height: 1.95rem; border-bottom: 1px solid var(--rule); }
.sp-name { flex: 1; padding: 2px 2px; font-size: 1rem; }
.sp-tools { display: inline-flex; gap: 1px; opacity: 0; transition: opacity .1s; }
.spell:hover .sp-tools, .spell:focus-within .sp-tools { opacity: 1; }
.spell.is-blank .sp-tools { display: none; }
.conc[data-state="1"] { background: var(--accent); color: var(--accent-ink); }
.spell:has(.conc[data-state="1"]) .sp-name { font-style: italic; }
@media (hover: none) { .spell:not(.is-blank) .sp-tools { opacity: 1; } }

/* ============================================================
   03-ui.css — barra superior, estado, herramientas, avisos, ventanas y menú inicial
   ============================================================ */

/* ---------- Barra superior y estado ---------- */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 8px 14px;
          background: var(--paper); border-bottom: 1.5px solid var(--line); }
.tb-id { display: flex; flex-direction: column; min-width: 0; line-height: 1.1; }
.tb-name { font-size: 1.15rem; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-type { font-family: var(--font-caps); font-size: .76rem; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
.tabs { display: flex; gap: 3px; padding: 3px; background: var(--grey); border-radius: 10px; margin-left: 8px; }
.tabs button { padding: 5px 15px; border-radius: 7px; font-weight: 700; }
.tabs button:hover:not(.on) { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.tabs button.on { background: var(--accent); color: var(--accent-ink); }
.tb-tools { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.save-state { font-size: .8rem; color: var(--ink-2); margin-right: 6px; }
.save-state.bad { color: var(--bad); font-weight: 700; }

.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; padding: 7px 14px; background: var(--grey); }
.hud-k { font-family: var(--font-caps); font-size: .8rem; color: var(--ink-2); font-weight: 700; letter-spacing: .05em; }
.hud-hp { position: relative; display: flex; align-items: baseline; gap: 5px; min-width: 170px; padding-bottom: 7px; }
.hud-hp b { font-size: 1.35rem; font-weight: 800; line-height: 1; }
.hud-of, .hud-temp { color: var(--ink-2); font-size: .92rem; }
.hud-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.hud-bar i { display: block; height: 100%; background: var(--good); transition: width .25s; }
.hud-hp.mid .hud-bar i { background: var(--warn); }
.hud-hp.low .hud-bar i { background: var(--bad); }
.hud-ac { display: flex; align-items: baseline; gap: 5px; }
.hud-ac b { font-size: 1.35rem; font-weight: 800; line-height: 1; }
.hud-pills { display: flex; flex-wrap: wrap; gap: 5px; }
.pill { padding: 1px 10px; border-radius: 99px; background: var(--paper); border: 1.5px solid var(--line); font-size: .82rem; font-weight: 700; }
.pill-bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.pill-conc { border-color: var(--accent); color: var(--accent); }

/* ---------- Panel de herramientas ---------- */
.tools { position: fixed; right: 0; top: var(--tb-h, 52px); bottom: 0; width: 340px; max-width: 94vw; z-index: 40; overflow-y: auto;
         background: var(--paper); border-left: 1.5px solid var(--line); box-shadow: var(--shadow); padding: 6px 16px 24px;
         transform: translateX(105%); visibility: hidden; transition: transform .2s ease, visibility 0s .2s; }
body[data-tools="open"] .tools { transform: none; visibility: visible; transition-delay: 0s; }
@media (min-width: 1240px) { body[data-tools="open"] .stage { padding-right: 340px; } .tools { box-shadow: none; } }
.tools-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 4px; }
.tools-head h2 { font-size: 1.25rem; }
.tl { border-top: 1px solid var(--rule); padding: 9px 0; }
.tl:first-of-type { border-top: 0; }
.tl summary { cursor: pointer; font-family: var(--font-caps); font-weight: 700; font-size: 1.05rem; letter-spacing: .05em; padding: 2px 0; }
.adv { display: grid; grid-template-columns: repeat(3, 1fr); margin: 9px 0; border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; }
.adv button { padding: 6px 2px; font-size: .86rem; font-weight: 700; border-left: 1px solid var(--line); }
.adv button:first-child { border-left: 0; }
.adv button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.dice-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.die { padding: 9px 0; border: 1.5px solid var(--line); border-radius: 9px; font-weight: 800; background: var(--paper); }
.die:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.expr { display: flex; gap: 6px; margin-top: 9px; }
.expr input { border: 1.5px solid var(--line); border-radius: 7px; padding: 4px 9px; background: var(--paper); }

.history { list-style: none; margin: 8px 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: 330px; overflow: auto; }
.h-entry { display: grid; grid-template-columns: 2.7rem minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 8px; }
.h-entry:first-child { background: var(--grey); }
.h-total { font-size: 1.3rem; text-align: center; }
.h-label { display: block; font-weight: 700; font-size: .92rem; }
.h-detail { display: block; font-size: .76rem; color: var(--ink-2); overflow-wrap: anywhere; }
.h-entry time { font-size: .72rem; color: var(--ink-2); }
.h-empty { color: var(--ink-2); font-size: .9rem; padding: 4px 2px; }
.flag-crit .h-total, .k-heal .h-total { color: var(--good); }
.flag-fumble .h-total, .k-dmg .h-total { color: var(--bad); }
.k-note .h-total { font-size: 1rem; color: var(--accent); }

.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 9px 0; }
.chip { padding: 3px 11px; border: 1.5px solid var(--rule); border-radius: 99px; font-size: .86rem; font-weight: 600; }
.chip:hover { border-color: var(--accent); }
.chip[data-state="1"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.exh { display: flex; flex-direction: column; gap: 3px; font-size: .86rem; font-family: var(--font-caps); font-weight: 700; }
.exh select, .session-notes { border: 1.5px solid var(--line); border-radius: 7px; padding: 5px 8px; background: var(--paper); font-family: var(--font); font-weight: 500; width: 100%; }
.session-notes { margin-top: 8px; height: auto; line-height: 1.4; }
.rest-btns { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }

/* ---------- Resultado de tirada ---------- */
#roll-toast { position: fixed; left: 50%; bottom: 22px; z-index: 60; display: flex; align-items: center; gap: 14px; max-width: min(94vw, 540px);
              padding: 10px 20px 10px 16px; background: var(--ink); color: var(--paper); border-radius: 16px; box-shadow: var(--shadow);
              opacity: 0; transform: translate(-50%, 26px); pointer-events: none; transition: opacity .18s, transform .18s; }
#roll-toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#roll-toast.flag-crit { box-shadow: 0 0 0 3px var(--good), var(--shadow); }
#roll-toast.flag-fumble { box-shadow: 0 0 0 3px var(--bad), var(--shadow); }
.rt-total { font-size: 2.7rem; font-weight: 800; line-height: 1; min-width: 2ch; text-align: center; }
.pop .rt-total { animation: pop .32s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.5) rotate(-12deg); } to { transform: none; } }
.rt-txt { display: flex; flex-direction: column; min-width: 0; }
.rt-label { font-weight: 800; font-size: 1.05rem; }
.rt-detail { font-size: .84rem; opacity: .8; overflow-wrap: anywhere; }
.rt-flag { padding: 2px 10px; border-radius: 99px; background: var(--paper); color: var(--ink); font-weight: 800; font-size: .8rem; }
#roll-toast .btn { background: var(--paper); color: var(--ink); }

/* ---------- Avisos ---------- */
#toasts { position: fixed; top: 66px; left: 50%; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; width: min(94vw, 430px); }
.toast { display: flex; align-items: center; gap: 10px; padding: 9px 8px 9px 14px; background: var(--paper); border: 1.5px solid var(--line);
         border-left-width: 6px; border-radius: 10px; box-shadow: var(--shadow); font-size: .96rem; }
.toast > span { flex: 1; }
.toast-good { border-left-color: var(--good); } .toast-bad { border-left-color: var(--bad); } .toast-warn { border-left-color: var(--warn); }
.toast-x { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 5px; color: var(--ink-2); flex: none; }
.toast-x:hover { background: var(--grey); }

/* ---------- Ventana modal ---------- */
dialog#modal { border: 2px solid var(--line); border-radius: 16px; padding: 0; background: var(--paper); color: var(--ink); box-shadow: var(--shadow); width: min(94vw, 520px); }
dialog#modal.wide { width: min(94vw, 780px); }
dialog#modal::backdrop { background: rgba(10, 12, 18, .6); }
.m-box { padding: 20px 22px 18px; }
.m-title { font-size: 1.5rem; margin-bottom: 12px; }
.m-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.plain { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 4px; }

.type-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.type-card { position: relative; display: block; cursor: pointer; }
.type-card:first-child { --accent: var(--accent-caster); }
.type-card:last-child { --accent: var(--accent-martial); }
.type-card input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tc-body { display: flex; flex-direction: column; gap: 6px; height: 100%; padding: 12px 14px 14px; border: 2px solid var(--rule); border-radius: 14px; background: var(--paper); }
.type-card:hover .tc-body { border-color: var(--accent); }
.type-card input:checked + .tc-body { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--paper)); box-shadow: 0 0 0 1.5px var(--accent); }
.type-card input:focus-visible + .tc-body { outline: 2px solid var(--accent); outline-offset: 3px; }
.tc-art { width: 100%; height: auto; margin-bottom: 4px; }
.pg { fill: var(--paper); stroke: var(--line); stroke-width: 1.2; }
.pg-off { fill: none; stroke-dasharray: 3 3; opacity: .5; }
.bx { fill: var(--grey); } .hl { fill: var(--accent); } .ln { stroke: var(--line); stroke-width: .8; opacity: .55; }
.tc-title { font-size: 1.3rem; color: var(--accent); }
.tc-who { font-size: .9rem; color: var(--ink-2); }
.type-card ul { margin: 4px 0 0; padding-left: 1.1rem; font-size: .92rem; display: flex; flex-direction: column; gap: 2px; }
.new-fields { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; margin: 16px 0 8px; }
.new-fields label { display: flex; flex-direction: column; gap: 3px; font-family: var(--font-caps); font-weight: 700; letter-spacing: .04em; font-size: .9rem; }
.new-fields input, .new-fields select { border: 1.5px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--paper); font-family: var(--font); font-weight: 500; font-size: 1rem; }

/* ---------- Menú inicial ---------- */
.home { max-width: 980px; margin: 0 auto; padding: 34px 16px 70px; }
.home-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 24px; }
.home-head h1 { font-size: 2.4rem; font-weight: 800; line-height: 1; }
.home-head p { color: var(--ink-2); margin-top: 6px; }
.home-tools { display: flex; gap: 4px; }
.warn-bar { background: color-mix(in srgb, var(--warn) 18%, var(--paper)); border: 1.5px solid var(--warn); border-radius: 9px; padding: 8px 12px; margin-bottom: 16px; }
.chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.char-new { min-height: 176px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 16px;
            border: 2px dashed var(--line); border-radius: 16px; text-align: center; transition: background .12s; }
.char-new:hover { background: var(--paper); }
.char-new b { font-size: 1.25rem; }
.char-new span:last-child { color: var(--ink-2); font-size: .92rem; }
.cn-plus { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--accent-caster); color: var(--accent-ink); margin-bottom: 6px; }
.cn-plus .ic { width: 24px; height: 24px; }
.char-card { position: relative; background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); border-top: 6px solid var(--accent); }
.char-card[data-type="martial"] { --accent: var(--accent-martial); }
.char-card[data-type="caster"] { --accent: var(--accent-caster); }
.cc-main { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; width: 100%; height: 100%; min-height: 170px; padding: 16px 16px 14px; text-align: left; border-radius: 10px 10px 16px 16px; }
.cc-main:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.cc-badge { font-family: var(--font-caps); font-weight: 700; font-size: .78rem; letter-spacing: .06em; color: var(--accent); }
.cc-name { font-size: 1.45rem; font-weight: 800; line-height: 1.08; overflow-wrap: anywhere; }
.cc-sub { color: var(--ink-2); }
.cc-hp { width: 100%; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; margin-top: auto; }
.cc-hp i { display: block; height: 100%; background: var(--good); }
.cc-meta { font-size: .82rem; color: var(--ink-2); }
.cc-tools { position: absolute; top: 12px; right: 8px; display: flex; opacity: 0; transition: opacity .12s; }
.char-card:hover .cc-tools, .char-card:focus-within .cc-tools { opacity: 1; }
@media (hover: none) { .cc-tools { opacity: 1; } }
.home-empty { margin-top: 20px; color: var(--ink-2); }

/* ---------- Pantallas chicas ---------- */
@media screen and (max-width: 860px) {
  .p-head, .p-body, .p-foot, .sp-grid { grid-template-columns: minmax(0, 1fr); }
  .d-grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: none; }
  .d-grid > * { grid-area: auto !important; }
  .d-allies, .d-story, .d-stowed { min-height: 240px; }
  .equip { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "coins cols" "potions potions" "foot foot"; }
  .potions { flex-direction: row; justify-content: space-around; }
  .features, .attacks { min-height: 260px; }
  .topbar { flex-wrap: wrap; }
  .tabs { order: 5; width: 100%; margin-left: 0; }
  .tabs button { flex: 1; }
  .tb-hide { display: none; }
  .tb-id { flex: 1; }
  .pages { padding: 8px 6px 60px; }
  .page { padding: 10px; }
  .type-pick, .new-fields { grid-template-columns: 1fr; }
  .home-head h1 { font-size: 2rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ============================================================
   04-print.css — «Imprimir» / «Guardar como PDF» (A4, colores claros siempre)
   ============================================================ */
@page { size: A4; margin: 7mm; }

@media print {
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
    --bg: #fff; --paper: #fff; --grey: #e4e6ea; --ink: #111; --ink-2: #444; --line: #1d222b; --rule: #b9bec8;
    --accent-caster: #3c3299; --accent-martial: #17624f; --accent-ink: #fff;
    color-scheme: light;
  }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { background: #fff !important; font-size: 12.5px; }

  .topbar, .hud, .tools, #toasts, #roll-toast, .no-print, .sp-toolbar, .ovr-reset { display: none !important; }
  .print-only { display: inline !important; }

  .stage, body[data-tools="open"] .stage { padding: 0 !important; }
  .pages { max-width: none; margin: 0; padding: 0; }
  .page { display: block !important; box-shadow: none; border-radius: 0; padding: 0; margin: 0; width: 900px; zoom: .823;
          break-after: page; break-inside: avoid; }
  .page:last-child { break-after: auto; }

  /* Los resultados de cálculo se ven igual; los campos no muestran subrayados de edición */
  .lvl, .spell { break-inside: avoid; }
  .sp-tools { display: none !important; }

// Leer / escribir con rutas tipo "spell.slots.1.used"
function getPath(obj, path) {
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
}
function setPath(obj, path, val) {
  const keys = path.split('.');
  const last = keys.pop();
  let o = obj;
  for (const k of keys) {
    if (o[k] == null || typeof o[k] !== 'object') o[k] = {};
    o = o[k];
  }
  o[last] = val;
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function download(filename, text, mime = 'application/json') {

/* ============================================================
   03-dice.js — tiradas de dados, ventaja/desventaja e historial
   ============================================================ */
const Dice = (() => {
  const history = [];          // entradas más nuevas primero
  const listeners = new Set(); // funciones que quieren enterarse de cada tirada
  let mode = 'normal';         // 'normal' | 'adv' | 'dis'

  // Un dado de `sides` caras. Usa crypto si existe (sin sesgo), si no Math.random.
  function die(sides) {
    if (window.crypto && crypto.getRandomValues) {
      const buf = new Uint32Array(1);
      const limit = Math.floor(0x100000000 / sides) * sides;
      let x;
      do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
      return (x % sides) + 1;
    }
    return 1 + Math.floor(Math.random() * sides);
  }

  // "2d6+3-1" -> [{sign,n,sides}, {sign,c}, ...]  (null si no se entiende)
  function parse(expr) {
    const s = String(expr).replace(/\s+/g, '').replace(/−/g, '-').toLowerCase();
    if (!s) return null;
    const re = /([+-]?)(?:(\d*)d(\d+)|(\d+))/y;
    const terms = [];
    let i = 0;
    while (i < s.length) {
      re.lastIndex = i;
      const m = re.exec(s);
      if (!m) return null;
      if (terms.length && !m[1]) return null;           // después del primer término hace falta + o -
      const sign = m[1] === '-' ? -1 : 1;
      if (m[3]) {
        const n = m[2] === '' ? 1 : +m[2];
        const sides = +m[3];
        if (n < 1 || n > 100 || sides < 2 || sides > 1000) return null;
        terms.push({ sign, n, sides });
      } else {
        terms.push({ sign, c: +m[4] });
      }
      i = re.lastIndex;
    }
    return terms;
  }

  // Busca la primera expresión de dados dentro de un texto: "1d8+3 cortante" -> "1d8+3"
  function extract(text) {
    const m = String(text || '').replace(/−/g, '-')
      .match(/(?:\d*d\d+|\d+)(?:\s*[+-]\s*(?:\d*d\d+|\d+))*/i);
    return m ? m[0].replace(/\s+/g, '') : null;
  }

  // Tira una expresión. crit=true duplica la cantidad de dados (daño crítico).
  function rollExpr(expr, { crit = false } = {}) {
    const terms = parse(expr);
    if (!terms) return null;
    let total = 0;
    const parts = [];
    for (const t of terms) {
      if (t.sides) {
        const n = crit ? t.n * 2 : t.n;
        const rolls = Array.from({ length: n }, () => die(t.sides));
        total += t.sign * rolls.reduce((a, b) => a + b, 0);
        parts.push(`${t.sign < 0 ? '-' : ''}[${rolls.join(', ')}]`);
      } else {
        total += t.sign * t.c;
        parts.push(`${t.sign < 0 ? '-' : '+'}${t.c}`);
      }
    }
    return { total, detail: parts.join(' ').replace(/ \+/g, ' + ').replace(/ -/g, ' - ') };
  }

  function push(entry) {
    entry.id = Date.now() + Math.random();
    entry.time = new Date();
    history.unshift(entry);
    if (history.length > 80) history.pop();
    listeners.forEach(fn => fn(entry));
    return entry;
  }

  // Prueba / salvación / ataque: d20 + bonificador, con ventaja o desventaja
  function check(label, bonus = 0, opts = {}) {
    const m = opts.mode || mode;
    const a = die(20);
    const b = m === 'normal' ? null : die(20);
    const used = b == null ? a : (m === 'adv' ? Math.max(a, b) : Math.min(a, b));
    const dice = b == null ? `[${a}]` : `[${a}, ${b}]`;
    const modeTxt = m === 'adv' ? ' (ventaja)' : m === 'dis' ? ' (desventaja)' : '';
    return push({
      ...(opts.meta || {}),     // datos extra (p. ej. qué ataque fue) para que la interfaz los use
      kind: 'd20', label, nat: used,
      formula: `d20${bonus ? signed(bonus) : ''}${modeTxt}`,
      detail: `${dice}${bonus ? ' ' + signed(bonus) : ''}`,
      total: used + bonus,
      flag: used === 20 ? 'crit' : used === 1 ? 'fumble' : null,
    });
  }

  // Daño, curación o cualquier expresión (se registra en el historial)
  function expression(label, expr, opts = {}) {
    const r = rollExpr(expr, opts);
    if (!r) return null;
    return push({
      kind: opts.kind || 'free', label,
      formula: opts.crit ? `${expr} (crítico)` : expr,
      detail: r.detail, total: r.total, flag: opts.crit ? 'crit' : null,
    });
  }

  return {
    history, die, parse, extract, rollExpr, check, expression, push,
    setMode(m) { mode = m; listeners.forEach(fn => fn(null)); },
    getMode: () => mode,
    clear() { history.length = 0; listeners.forEach(fn => fn(null)); },
    onRoll(fn) { listeners.add(fn); },
  };
})();

   04-store.js — personajes: crear, guardar (localStorage), importar/exportar
   ============================================================ */

  const KEY = 'hoja5e.v1';

  const savedListeners = new Set();

    const abil = {}, saves = {}, skills = {}, coins = {}, slots = {}, lists = {};
    DATA.abilities.forEach(a => { abil[a.k] = 10; saves[a.k] = 0; });

    DATA.coins.forEach(c => { coins[c.k] = 0; });
    for (let l = 1; l <= 9; l++) slots[l] = { total: 0, used: 0 };
    for (let l = 0; l <= 9; l++) lists[l] = [];
    const attackRows = type === 'caster' ? 3 : 4;   // igual que en los PDF

    return {
      id: uid(), v: 1, type, created: Date.now(), updated: Date.now(),
      info: { name: '', class: '', classId: 'custom', level: 1, background: '', player: '', race: '', alignment: '', xp: '' },
      abilities: abil, saves, skills,
      profOverride: null,           // null = se calcula según el nivel
      inspiration: 0,
      ac: 10, speed: '9 m',
      initOverride: null,           // null = Destreza; si el usuario escribe un valor, queda fijo
      hp: { max: 0, current: 0, temp: 0 },
      hdDie: 8, hdSpent: 0,
      death: { s: 0, f: 0 },
      attacks: Array.from({ length: attackRows }, () => ({ name: '', bonus: '', damage: '' })),
      attackNotes: '', features: '', equipment: '', equipment2: '',
      coins, potions: { minor: 0, greater: 0, superior: 0 },
      profs: {
        armor: { light: 0, medium: 0, heavy: 0, shields: 0 },
        weapons: { simple: 0, martial: 0, other: 0 },
        otherWeapons: '', languages: '', tools: '',
      },
      resources: [],                // {name,total,used,recharge:'long'|'short'|'none'}
      conditions: {}, exhaustion: 0,
      notes: '',
      details: {
        age: '', height: '', weight: '', eyes: '', skin: '', hair: '',
        allies: '', personality: '', ideals: '', bonds: '', flaws: '',
        background: '', otherProf: '', backstory: '', stowed: '',
      },
      spell: type === 'caster' ? {
        class: '', ability: 'int', auto: false, casterType: 'none', slotsRecharge: 'long',
        slots, lists, concentration: '',
      } : null,
    };
  }

  // Rellena lo que falte (por si un archivo viejo o importado no trae todos los campos)
  function mergeDefaults(target, defaults) {
    for (const k of Object.keys(defaults)) {
      const d = defaults[k];
      if (target[k] === undefined || target[k] === null) {
        if (!(k === 'profOverride' || k === 'spell')) target[k] = deepClone(d);
        else if (k === 'profOverride') target[k] = null;
      } else if (d && typeof d === 'object' && !Array.isArray(d) && typeof target[k] === 'object') {
        mergeDefaults(target[k], d);
      }
    }
    return target;
  }
  function normalize(ch) {
    const type = ch.type === 'caster' ? 'caster' : 'martial';
    ch.type = type;
    const base = blank(type);
    if (type === 'caster' && !ch.spell) ch.spell = deepClone(base.spell);
    mergeDefaults(ch, base);
    if (type === 'martial') ch.spell = null;
    if (!ch.id) ch.id = uid();
    return ch;
  }

  // Aplica una clase: dado de golpe, salvaciones con competencia, característica de conjuro
  function applyClass(ch, classId) {
    const c = DATA.classById(classId);
    if (!c) return;
    ch.info.classId = c.id;
    if (c.id !== 'custom') {
      ch.info.class = c.short || c.name;
      ch.hdDie = c.hd;
      DATA.abilities.forEach(a => { ch.saves[a.k] = c.saves.includes(a.k) ? 1 : 0; });
    }
    if (ch.spell) {
      ch.spell.casterType = c.caster;
      ch.spell.auto = c.caster !== 'none';
      ch.spell.slotsRecharge = c.caster === 'pact' ? 'short' : 'long';
      if (c.ability) ch.spell.ability = c.ability;
      ch.spell.class = c.short || c.name;
      if (c.id === 'custom') ch.spell.class = '';
    }
  }

  // ---------- Persistencia ----------
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const p = JSON.parse(raw);
        db.chars = {};
        Object.values(p.chars || {}).forEach(c => { db.chars[c.id] = normalize(c); });
        db.order = (p.order || []).filter(id => db.chars[id]);
        Object.keys(db.chars).forEach(id => { if (!db.order.includes(id)) db.order.push(id); });
        db.settings = { theme: 'auto', ...(p.settings || {}) };
      }
      localStorage.setItem(KEY + '.test', '1'); localStorage.removeItem(KEY + '.test');
      storageOk = true;
    } catch (e) { storageOk = false; }
  }

  function persistNow() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); storageOk = true; }
    catch (e) { storageOk = false; }
    savedListeners.forEach(fn => fn(storageOk));
  }
  const persist = debounce(persistNow, 250);

  // ---------- API ----------
  return {
    load,
    all: () => db.order.map(id => db.chars[id]),
    get: id => db.chars[id],
    make: type => blank(type === 'caster' ? 'caster' : 'martial'),
    isStorageOk: () => storageOk,
    onSaved: fn => savedListeners.add(fn),
    flush: persistNow,

    // La app nativa administra los perfiles. Dentro del editor se mantiene
    // exactamente un personaje y se persiste el documento completo.
    replaceSingle(raw, type = 'martial') {
      const source = raw && typeof raw === 'object' ? deepClone(raw) : blank(type);
      const ch = normalize(source);
      db.chars = { [ch.id]: ch };
      db.order = [ch.id];
      persistNow();
      return ch;
    },

    create(type, { name = '', classId = 'custom' } = {}) {
      const ch = blank(type);
      ch.info.name = name;
      applyClass(ch, classId);
      db.chars[ch.id] = ch;
      db.order.unshift(ch.id);
      persistNow();
      return ch;
    },
    applyClass,
    touch(ch) { ch.updated = Date.now(); persist(); },
    duplicate(id) {
      const src = db.chars[id]; if (!src) return null;
      const ch = deepClone(src);
      ch.id = uid(); ch.created = ch.updated = Date.now();
      ch.info.name = (src.info.name || 'Sin nombre') + ' (copia)';
      db.chars[ch.id] = ch; db.order.unshift(ch.id);
      persistNow();
      return ch;
    },
    remove(id) {
      delete db.chars[id];
      db.order = db.order.filter(x => x !== id);
      persistNow();
    },

    settings: () => db.settings,
    setSetting(k, v) { db.settings[k] = v; persistNow(); },

    // ---------- Importar / exportar ----------
    exportOne(id) {
      return JSON.stringify({ app: 'hoja5e', v: 1, chars: [db.chars[id]] }, null, 2);
    },
    exportAll() {
      return JSON.stringify({ app: 'hoja5e', v: 1, chars: db.order.map(id => db.chars[id]) }, null, 2);
    },
    // Devuelve cuántos personajes importó. Siempre crea copias nuevas (no pisa nada).
    importText(text) {
      const data = JSON.parse(text);
      const list = Array.isArray(data.chars) ? data.chars : (data.info ? [data] : []);
      let n = 0;
      for (const raw of list) {
        if (!raw || !raw.info) continue;
        const ch = normalize(raw);
        ch.id = uid(); ch.updated = Date.now();
        db.chars[ch.id] = ch; db.order.unshift(ch.id);
        n++;
      }
      if (n) persistNow();
      return n;
    },
  };
})();

/* ============================================================
   05-calc.js — todo lo que se calcula a partir de los datos del personaje
   ============================================================ */
const Calc = (() => {
  // Modificador de una puntuación: 10-11 → 0, 12-13 → +1, 8-9 → -1 ...
  const mod = score => Math.floor((toInt(score, 10) - 10) / 2);

  const level   = ch => clamp(toInt(ch.info.level, 1), 1, 20);
  const prof    = ch => (ch.profOverride != null && ch.profOverride !== '')
                          ? toInt(ch.profOverride, 2)
                          : Math.ceil(level(ch) / 4) + 1;
  const abilMod = (ch, k) => mod(ch.abilities[k]);
  const saveBonus = (ch, k) => abilMod(ch, k) + (ch.saves[k] ? prof(ch) : 0);

  // Habilidad (el clic cicla en este orden): 0 sin competencia · 1 competente · 2 pericia (doble) · 3 mitad (p. ej. Bardo)
  function skillBonus(ch, skill) {
    const st = ch.skills[skill.k] || 0;
    const p = prof(ch);
    const extra = st === 1 ? p : st === 2 ? 2 * p : st === 3 ? Math.floor(p / 2) : 0;
    return abilMod(ch, skill.ab) + extra;
  }
  const skillByKey = k => DATA.skills.find(s => s.k === k);

  const initiative = ch => (ch.initOverride != null && ch.initOverride !== '')
                             ? toInt(ch.initOverride, 0) : abilMod(ch, 'dex');
  const passive = (ch, k) => 10 + skillBonus(ch, skillByKey(k));

  const hdTotal = ch => level(ch);
  const hdLeft  = ch => Math.max(0, hdTotal(ch) - toInt(ch.hdSpent, 0));

  // Conjuros
  const spellMod = ch => (ch.spell ? abilMod(ch, ch.spell.ability) : 0);
  const spellDC  = ch => 8 + prof(ch) + spellMod(ch);
  const spellAtk = ch => prof(ch) + spellMod(ch);

  // Espacios que corresponden por clase y nivel → { 1: n, 2: n, ... 9: n }
  function autoSlots(ch) {
    const out = {};
    for (let l = 1; l <= 9; l++) out[l] = 0;
    const t = ch.spell && ch.spell.casterType;
    const lv = level(ch);
    if (t === 'pact') {
      const [n, l] = DATA.slotTables.pact[lv - 1];
      out[l] = n;
    } else if (DATA.slotTables[t]) {
      DATA.slotTables[t][lv - 1].forEach((n, i) => { out[i + 1] = n; });
    }
    return out;
  }
  // Si "automático" está activo, copia los totales calculados al personaje. Devuelve true si algo cambió.
  function syncSlots(ch) {
    if (!ch.spell || !ch.spell.auto) return false;
    const t = autoSlots(ch);
    let changed = false;
    for (let l = 1; l <= 9; l++) {
      const s = ch.spell.slots[l];
      if (s.total !== t[l]) { s.total = t[l]; changed = true; }
      if (s.used > s.total) { s.used = s.total; changed = true; }
    }
    return changed;
  }

  // Capacidad de carga: Fuerza × 15 lb (la mitad en kg, como en la edición en español)
  const carry = ch => toInt(ch.abilities.str, 10) * 15;

  // Mapa plano "clave → texto" para los elementos con data-out="clave"
  function outputs(ch) {
    const o = {};
    DATA.abilities.forEach(a => {
      o['mod.' + a.k] = signed(abilMod(ch, a.k));
      o['save.' + a.k] = signed(saveBonus(ch, a.k));
    });
    DATA.skills.forEach(s => { o['skill.' + s.k] = signed(skillBonus(ch, s)); });
    o.prof = signed(prof(ch));
    o.init = signed(initiative(ch));
    o['passive.perception'] = passive(ch, 'perception');
    o['passive.insight'] = passive(ch, 'insight');
    o['passive.investigation'] = passive(ch, 'investigation');
    o.hdTotal = `${hdTotal(ch)}d${ch.hdDie}`;
    o.hdLeft = hdLeft(ch);
    o.carry = `${carry(ch)} lb (${carry(ch) / 2} kg)`;
    if (ch.spell) {
      o.spellDC = spellDC(ch);
      o.spellAtk = signed(spellAtk(ch));
      o.spellAbilityMod = signed(spellMod(ch));
    }
    return o;
  }

  return { mod, level, prof, abilMod, saveBonus, skillBonus, skillByKey, initiative, passive,
           hdTotal, hdLeft, spellMod, spellDC, spellAtk, autoSlots, syncSlots, carry, outputs };
})();

    <span class="sp-tools no-print">

      <button type="button" class="mini" data-act="cast" data-arg="${l}:${i}" title="${l === 0 ? 'Lanzar truco' : 'Lanzar (gasta un espacio)'}" aria-label="Lanzar">${icon('bolt')}</button>

/* ============================================================
   09-game.js — reglas del juego: daño, curación, salvaciones de muerte,
   dados de golpe, pociones, lanzar conjuros y descansos.
   Cada función modifica el personaje y avisa con Toast / historial de dados.
   (La pantalla se actualiza después con App.refresh().)
   ============================================================ */
const Game = {
  // ---------- Tiradas pedidas desde la hoja ----------
  roll(ch, arg) {
    const [kind, key] = String(arg).split(':');
    if (kind === 'check') {
      const a = DATA.abilityByKey(key);
      return Dice.check(`Prueba de ${a.name}`, Calc.abilMod(ch, key));
    }
    if (kind === 'save') {
      const a = DATA.abilityByKey(key);
      return Dice.check(`Salvación de ${a.name}`, Calc.saveBonus(ch, key));
    }
    if (kind === 'skill') {
      const s = Calc.skillByKey(key);
      return Dice.check(s.name, Calc.skillBonus(ch, s));
    }
    if (kind === 'init') return Dice.check('Iniciativa', Calc.initiative(ch));
    if (kind === 'spellatk') return Dice.check('Ataque de conjuro', Calc.spellAtk(ch));
  },

  attack(ch, i) {
    const a = ch.attacks[i]; if (!a) return;
    return Dice.check(`${a.name || 'Ataque'}`, toInt(a.bonus, 0), { meta: { atk: i } });
  },
  attackDamage(ch, i, crit = false) {
    const a = ch.attacks[i]; if (!a) return;
    const expr = Dice.extract(a.damage);
    if (!expr) { Toast.show('Escribe el daño con dados, por ejemplo 1d8+3 cortante.', { kind: 'warn' }); return; }
    return Dice.expression(`${a.name || 'Ataque'} (daño)`, expr, { crit, kind: 'dmg' });
  },

  // ---------- Vida ----------
  damage(ch, amount) {
    let n = Math.max(0, toInt(amount, 0));
    if (!n) return;
    if (toInt(ch.hp.max, 0) <= 0 && ch.hp.current <= 0) {
      Toast.show('Primero escribe tus PG máximos en el recuadro de vida (los actuales se completan solos).', { kind: 'warn' });
      return;
    }
    const total = n;
    if (ch.hp.temp > 0) { const t = Math.min(ch.hp.temp, n); ch.hp.temp -= t; n -= t; }
    const before = ch.hp.current;
    ch.hp.current = Math.max(0, before - n);

    if (before > 0 && ch.hp.current === 0) {
      if (n - before >= ch.hp.max && ch.hp.max > 0) {
        Toast.show('El daño sobrante iguala o supera tus PG máximos: muerte instantánea.', { kind: 'bad' });
      } else {
        Toast.show('Caes a 0 PG: inconsciente. Empiezan las salvaciones de muerte.', { kind: 'bad' });
      }
      ch.conditions.unconscious = 1;
    } else if (before === 0 && n > 0) {
      ch.death.f = Math.min(3, (ch.death.f || 0) + 1);       // daño estando a 0 PG = fallo
      Toast.show('Daño a 0 PG: suma un fallo de salvación de muerte.', { kind: 'bad' });
    }

    Toast.show(`Recibes ${total} de daño. PG: ${ch.hp.current}${ch.hp.max > 0 ? ' de ' + ch.hp.max : ''}.`, { kind: 'bad' });

    // Concentración: CD 10 o la mitad del daño, lo que sea mayor
    if (ch.spell && ch.spell.concentration && ch.hp.current > 0) {
      const dc = Math.max(10, Math.floor(total / 2));
      Toast.show(`Concentración en ${ch.spell.concentration}: salvación de Constitución CD ${dc}.`, {
        kind: 'warn', sticky: true,
        actions: [{ label: 'Tirar', fn: () => { Dice.check(`Concentración (CD ${dc})`, Calc.saveBonus(ch, 'con')); } }],
      });
    }
  },

  heal(ch, amount) {
    const n = Math.max(0, toInt(amount, 0));
    if (!n) return 0;
    const was = ch.hp.current;
    const cap = ch.hp.max > 0 ? ch.hp.max : Infinity;
    ch.hp.current = Math.min(cap, was + n);
    if (was === 0 && ch.hp.current > 0) { ch.death.s = 0; ch.death.f = 0; ch.conditions.unconscious = 0; }
    return ch.hp.current - was;
  },

  deathRoll(ch) {
    if (ch.hp.current > 0) { Toast.show('Solo se tira con 0 PG.', { kind: 'warn' }); return; }
    if (ch.death.f >= 3) { Toast.show('El personaje ya murió (tres fallos). Reinicia los fallos si fue un error.', { kind: 'warn' }); return; }
    if (ch.death.s >= 3) { Toast.show('Ya estás estable (tres éxitos): no hace falta tirar más.', { kind: 'warn' }); return; }
    const e = Dice.check('Salvación de muerte', 0, { mode: 'normal' });
    if (e.nat === 20) {
      ch.hp.current = 1; ch.death.s = 0; ch.death.f = 0; ch.conditions.unconscious = 0;
      Toast.show('¡20 natural! Recuperas 1 PG y vuelves en ti.', { kind: 'good' });
    } else if (e.nat === 1) {
      ch.death.f = Math.min(3, ch.death.f + 2);
      Toast.show('1 natural: dos fallos.', { kind: 'bad' });
    } else if (e.total >= 10) ch.death.s = Math.min(3, ch.death.s + 1);
    else ch.death.f = Math.min(3, ch.death.f + 1);
    if (ch.hp.current === 0 && ch.death.s >= 3) Toast.show('Tres éxitos: estás estable.', { kind: 'good' });
    if (ch.hp.current === 0 && ch.death.f >= 3) Toast.show('Tres fallos: el personaje muere.', { kind: 'bad' });
  },

  // ---------- Dados de golpe y pociones ----------
  spendHD(ch) {
    if (Calc.hdLeft(ch) <= 0) { Toast.show('No te quedan dados de golpe.', { kind: 'warn' }); return null; }
    const con = Calc.abilMod(ch, 'con');
    const expr = `1d${ch.hdDie}${con ? signed(con) : ''}`;
    const r = Dice.rollExpr(expr);
    const gained = Math.max(0, r.total);
    ch.hdSpent = toInt(ch.hdSpent, 0) + 1;
    const real = Game.heal(ch, gained);
    Dice.push({ kind: 'heal', label: 'Dado de golpe', formula: expr, detail: `${r.detail} → +${real} PG`, total: real });
    return real;
  },

  potion(ch, k) {
    const p = DATA.potions.find(x => x.k === k);
    if (!ch.potions[k] || ch.potions[k] < 1) { Toast.show(`No tienes ${p.name.toLowerCase()}.`, { kind: 'warn' }); return; }
    const r = Dice.rollExpr(p.dice);
    ch.potions[k] -= 1;
    const real = Game.heal(ch, r.total);
    Dice.push({ kind: 'heal', label: p.name, formula: p.dice, detail: `${r.detail} → +${real} PG`, total: real });
  },

  // ---------- Conjuros ----------
  cast(ch, l, i) {
    const e = ((ch.spell.lists[l] || [])[i]);
    if (!e || !String(e.name || '').trim()) return;
    if (l === 0) { Dice.push({ kind: 'note', label: `Lanzas ${e.name}`, formula: 'Truco', detail: '', total: '' }); return; }
    let slot = 0;
    for (let s = l; s <= 9; s++) {
      const sl = ch.spell.slots[s];
      if (sl.total > 0 && sl.used < sl.total) { slot = s; break; }
    }
    if (!slot) { Toast.show(`No te quedan espacios de nivel ${l} o superior.`, { kind: 'warn' }); return; }
    ch.spell.slots[slot].used++;
    const up = slot > l ? ` (como nivel ${slot})` : '';
    Dice.push({ kind: 'note', label: `Lanzas ${e.name}${up}`, formula: `Espacio de nivel ${slot}`, detail: '', total: '' });
    if (e.conc) {
      const prev = ch.spell.concentration;
      ch.spell.concentration = e.name;
      if (prev && prev !== e.name) Toast.show(`Dejas de concentrarte en ${prev}.`, { kind: 'warn' });
    }
  },

  // ---------- Descansos ----------
  shortRest(ch) {
    ch.resources.forEach(r => { if (r.recharge === 'short') r.used = 0; });
    if (ch.spell && ch.spell.slotsRecharge === 'short') {
      for (let l = 1; l <= 9; l++) ch.spell.slots[l].used = 0;
    }
  },

  longRest(ch) {
    ch.hp.current = ch.hp.max;
    ch.hp.temp = 0;
    ch.death.s = 0; ch.death.f = 0;
    ch.conditions.unconscious = 0;
    const back = Math.max(1, Math.floor(Calc.level(ch) / 2));      // recuperas la mitad de tus dados
    ch.hdSpent = Math.max(0, toInt(ch.hdSpent, 0) - back);
    ch.resources.forEach(r => { if (r.recharge !== 'none') r.used = 0; });
    if (ch.spell) {
      for (let l = 1; l <= 9; l++) ch.spell.slots[l].used = 0;
      ch.spell.concentration = '';
    }
    ch.exhaustion = Math.max(0, toInt(ch.exhaustion, 0) - 1);
  },
};

/* ============================================================
   10-ui-tools.js — ventana modal, avisos, resultado de tirada,
   panel de herramientas (dados, historial, estados, descansos, notas) y barra de estado
   ============================================================ */

// ---------- Ventana modal (usa <dialog>) ----------
const Modal = (() => {
  let dlg = null;
  function ensure() {
    if (dlg) return dlg;
    dlg = document.createElement('dialog');
    dlg.id = 'modal';
    document.body.appendChild(dlg);
    dlg.addEventListener('mousedown', e => { if (e.target === dlg) close(); });   // clic fuera = cerrar
    return dlg;
  }
  function open({ title, html = '', buttons = [], wide = false, onOpen }) {
    const d = ensure();
    d.className = wide ? 'wide' : '';
    d.innerHTML = `<div class="m-box"><h2 class="m-title">${esc(title)}</h2>
      <div class="m-body">${html}</div><div class="m-actions"></div></div>`;
    const bar = $('.m-actions', d);
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn ' + (b.cls || '');
      btn.textContent = b.label;
      btn.addEventListener('click', () => { if (!b.onClick || b.onClick(d) !== true) close(); });
      bar.appendChild(btn);
    });
    if (!d.open) d.showModal();
    if (onOpen) onOpen(d);
  }
  function close() { if (dlg && dlg.open) dlg.close(); }
  return { open, close };
})();

// ---------- Avisos cortos ----------
const Toast = (() => {
  function box() {
    let b = $('#toasts');
    if (!b) {
      b = document.createElement('div');
      b.id = 'toasts'; b.setAttribute('aria-live', 'polite');
      document.body.appendChild(b);
    }
    return b;
  }
  function show(text, { kind = 'info', sticky = false, actions = [] } = {}) {
    const t = document.createElement('div');
    t.className = `toast toast-${kind}`;
    t.innerHTML = `<span>${esc(text)}</span>`;
    actions.forEach(a => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn btn-sm'; b.textContent = a.label;
      b.addEventListener('click', () => { t.remove(); a.fn(); });
      t.appendChild(b);
    });
    const x = document.createElement('button');
    x.type = 'button'; x.className = 'toast-x'; x.setAttribute('aria-label', 'Cerrar aviso');
    x.innerHTML = icon('x');
    x.addEventListener('click', () => t.remove());
    t.appendChild(x);
    box().appendChild(t);
    if (!sticky) setTimeout(() => t.remove(), 4500 + text.length * 35);
  }
  return { show };
})();

// ---------- Resultado grande de la última tirada ----------
const RollToast = (() => {
  let timer = null;
  function show(entry) {
    let el = $('#roll-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'roll-toast'; el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    const isNote = entry.kind === 'note';
    const extra = (entry.flag === 'crit' && entry.atk != null)
      ? `<button type="button" class="btn btn-sm" data-act="crit-dmg" data-arg="${entry.atk}">Daño crítico</button>` : '';
    el.className = `roll-toast ${entry.flag ? 'flag-' + entry.flag : ''} ${isNote ? 'is-note' : ''}`;
    el.innerHTML = `${isNote ? '' : `<b class="rt-total">${entry.total}</b>`}
      <div class="rt-txt"><span class="rt-label">${esc(entry.label)}</span>
      <span class="rt-detail">${esc(entry.formula)}${entry.detail ? ' · ' + esc(entry.detail) : ''}</span></div>
      ${entry.flag === 'crit' && entry.kind === 'd20' ? '<span class="rt-flag">¡Crítico!</span>' : ''}
      ${entry.flag === 'fumble' ? '<span class="rt-flag">Pifia</span>' : ''}${extra}`;
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop', 'show');
    clearTimeout(timer);
    timer = setTimeout(() => el.classList.remove('show'), entry.atk != null && entry.flag === 'crit' ? 9000 : 5000);
  }
  return { show };
})();

// ---------- Barra de estado (siempre visible arriba) ----------
Tools.status = ch => {
  if (ch.hp.current > 0 || toInt(ch.hp.max, 0) <= 0) return '';
  if (ch.death.f >= 3) return 'Muerto';
  if (ch.death.s >= 3) return 'Estable';
  return 'Inconsciente';
};

Tools.renderHud = ch => {
  const hud = $('#hud'); if (!hud) return;
  const max = Math.max(0, toInt(ch.hp.max, 0)), cur = Math.max(0, toInt(ch.hp.current, 0));
  const pct = max > 0 ? clamp(cur / max * 100, 0, 100) : 0;
  const level = pct <= 25 ? 'low' : pct <= 50 ? 'mid' : 'ok';
  const status = Tools.status(ch);
  const pills = [];
  if (status) pills.push(`<span class="pill pill-bad">${status}</span>`);
  DATA.conditions.filter(c => ch.conditions[c.k]).forEach(c => pills.push(`<span class="pill" title="${esc(c.tip)}">${c.name}</span>`));
  if (ch.exhaustion > 0) pills.push(`<span class="pill" title="${esc(DATA.exhaustion[ch.exhaustion])}">Agotamiento ${ch.exhaustion}</span>`);
  if (ch.spell && ch.spell.concentration) pills.push(`<span class="pill pill-conc">Concentración: ${esc(ch.spell.concentration)}</span>`);
  hud.innerHTML = `
    <div class="hud-hp ${level}"><span class="hud-k">PG</span><b>${cur}</b><span class="hud-of">/ ${max || '–'}</span>
      ${ch.hp.temp > 0 ? `<span class="hud-temp">+${ch.hp.temp} temp.</span>` : ''}
      <div class="hud-bar" aria-hidden="true"><i style="width:${pct}%"></i></div></div>
    <span class="hud-ac"><span class="hud-k">CA</span><b>${esc(ch.ac)}</b></span>
    <div class="hud-pills">${pills.join('')}</div>`;
  // Barra dentro del recuadro de vida de la hoja
  const bar = $('.hp-bar i');
  if (bar) { bar.style.width = pct + '%'; bar.parentElement.dataset.level = level; }
};

const Menu = {};

Menu.timeAgo = ts => {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return 'hace un momento';
  if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
  if (s < 86400) return `hace ${Math.floor(s / 3600)} h`;
  const d = Math.floor(s / 86400);
  return d === 1 ? 'ayer' : d < 30 ? `hace ${d} días` : new Date(ts).toLocaleDateString('es-AR');
};
